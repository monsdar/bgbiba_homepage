name: Deploy BG BiBA Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Alle 6 Stunden (00:00, 06:00, 12:00, 18:00 UTC) frische Daten & Instagram News synchronisieren
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Erforderliche Berechtigungen für GitHub Pages Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert konkurrierende Deployments
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.134.1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Refresh Instagram Token
        id: refresh_ig
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "Kein INSTAGRAM_TOKEN hinterlegt - überspringe Token-Refresh."
            echo "ACTIVE_IG_TOKEN=" >> $GITHUB_ENV
            exit 0
          fi

          echo "Prüfe Instagram Token-Status..."
          REFRESH_RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")
          NEW_TOKEN=$(echo "$REFRESH_RESPONSE" | jq -r '.access_token // empty')

          if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "null" ]; then
            echo "Instagram Token erfolgreich erneuert!"
            echo "ACTIVE_IG_TOKEN=$NEW_TOKEN" >> $GITHUB_ENV
            if [ -n "${{ secrets.SECRETS_PAT }}" ]; then
              echo "Aktualisiere INSTAGRAM_TOKEN Secret im Repository..."
              gh secret set INSTAGRAM_TOKEN --body "$NEW_TOKEN" --repo "${{ github.repository }}" || echo "Konnte Secret nicht aktualisieren (evtl. unzureichende PAT-Berechtigung)."
            fi
          else
            echo "Token ist noch frisch (<24h alt) oder ein Page-Token. Bestehender Token wird weiterverwendet."
            echo "ACTIVE_IG_TOKEN=$IG_TOKEN" >> $GITHUB_ENV
          fi

      - name: Build with Hugo
        env:
          # Externe Secrets für BookStack, TeamSL API, Instagram und Analytics
          BS_ID: ${{ secrets.BS_ID }}
          BS_SECRET: ${{ secrets.BS_SECRET }}
          SLAPI_TOKEN: ${{ secrets.SLAPI_TOKEN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          INSTAGRAM_TOKEN: ${{ env.ACTIVE_IG_TOKEN || secrets.INSTAGRAM_TOKEN }}
        run: |
          echo "=== Prüfe Verfügbarkeit der externen Secrets ==="
          if [ -z "$BS_ID" ] || [ -z "$BS_SECRET" ]; then
            echo "::warning title=BookStack Secrets fehlen::BS_ID oder BS_SECRET ist nicht in GitHub Secrets hinterlegt. Wiki-Inhalte werden als Fallback-Hinweis gerendert."
          else
            echo "✓ BookStack Secrets vorhanden."
          fi

          if [ -z "$SLAPI_TOKEN" ]; then
            echo "::warning title=SLAPI_TOKEN fehlt::SLAPI_TOKEN ist nicht in GitHub Secrets hinterlegt. TeamSL-Spieldaten und Tabellen werden als Fallback-Hinweis gerendert."
          else
            echo "✓ SLAPI_TOKEN vorhanden."
          fi

          if [ -z "$INSTAGRAM_TOKEN" ]; then
            echo "::warning title=INSTAGRAM_TOKEN fehlt::INSTAGRAM_TOKEN ist nicht in GitHub Secrets hinterlegt. Instagram-News werden als Fallback-Hinweis gerendert."
          else
            echo "✓ INSTAGRAM_TOKEN vorhanden."
          fi
          echo "==============================================="

          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
