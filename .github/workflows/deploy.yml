name: Deploy BG BiBA Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Jeden Montag und Donnerstag um 06:00 UTC (Frische Spielberichte & Spieltags-Vorschauen)
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

# Erforderliche Berechtigungen für GitHub Pages Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert konkurrierende Deployments
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.134.1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          # Externe Secrets für BookStack, TeamSL API und Analytics
          BS_ID: ${{ secrets.BS_ID }}
          BS_SECRET: ${{ secrets.BS_SECRET }}
          SLAPI_TOKEN: ${{ secrets.SLAPI_TOKEN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
