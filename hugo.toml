baseURL = 'https://bgbiba.de/'
languageCode = 'de-de'
defaultContentLanguage = 'de'
title = 'BG BiBA – Basketballgemeinschaft Bierden-Bassen-Achim'
timeout = '60s'

# Hugo Security Configuration
# Erlaubt Zugriff auf GitHub Secrets / Environment Variables und externe APIs
[security]
  enableInlineShortcodes = false
  [security.funcs]
    getenv = ['^BS_', '^SLAPI_', '^TEAMSL_', '^GA_', '^INSTAGRAM_', '^IG_']
  [security.http]
    methods = ['(?i)GET']
    urls = ['.*']

# Ordner-Mounts: Bindet den Root-Ordner "slideshow/" dynamisch in Hugo Assets ein
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'slideshow'
    target = 'assets/slideshow'



