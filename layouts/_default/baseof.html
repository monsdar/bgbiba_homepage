<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "de" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#412774">
  
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ strings.TrimPrefix "/" site.Params.logo | absURL }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ strings.TrimPrefix "/" site.Params.logo_tiny | relURL }}">
  <link rel="apple-touch-icon" href="{{ strings.TrimPrefix "/" site.Params.logo_tiny | relURL }}">

  <!-- Main Stylesheet with Hugo Pipes Minification & Fingerprinting -->
  {{- $css := resources.Get "css/main.css" | minify | fingerprint -}}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  {{ partial "header.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script>
    (function() {
      var navToggle = document.getElementById('mobile-nav-toggle');
      var nav = document.getElementById('main-nav');
      if (navToggle && nav) {
        navToggle.addEventListener('click', function() {
          nav.classList.toggle('active');
        });
      }
    })();
  </script>

  {{- if and hugo.IsProduction (not hugo.IsServer) }}
  <!-- GoatCounter Analytics (nur im Production-Build aktiv) -->
  <script data-goatcounter="https://bgbiba.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  {{- end }}
</body>
</html>
