<!-- Topbar -->
<div class="topbar">
  <div class="container">
    <div class="topbar-meta">
      <span class="topbar-stammvereine">Spielgemeinschaft: <strong>TSV Bierden</strong> &bull; <strong>TSV Bassen</strong> &bull; <strong>TSV Achim</strong></span>
    </div>
    <div class="topbar-links">
      <a href="{{ site.Params.wiki }}" target="_blank" rel="noopener" class="topbar-link">
        <span>📖 Wiki</span>
      </a>
      <a href="{{ site.Params.fanshop }}" target="_blank" rel="noopener" class="topbar-link">
        <span>🛍️ Fanshop</span>
      </a>
      <a href="{{ site.Params.instagram }}" target="_blank" rel="noopener" class="topbar-link" title="Instagram">
        <span>📸 Instagram</span>
      </a>
      <a href="{{ site.Params.whatsapp }}" target="_blank" rel="noopener" class="topbar-link" title="WhatsApp Channel">
        <span>💬 WhatsApp</span>
      </a>
    </div>
  </div>
</div>

<!-- Main Header -->
<header class="header">
  <div class="container">
    <a href="{{ site.BaseURL }}" class="brand">
      <img src="{{ site.Params.logo }}" alt="{{ site.Title }} Logo" class="brand-logo" width="48" height="48">
      <div class="brand-text">
        <span class="brand-title">{{ site.Params.short_name }}</span>
        <span class="brand-subtitle">Basketball</span>
      </div>
    </a>

    <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Menü öffnen">
      ☰
    </button>

    <nav class="nav" id="main-nav">
      <ul class="nav-list">
        {{ range site.Menus.main }}
          <li>
            <a href="{{ .URL }}" class="nav-link {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}active{{ end }}" {{ if strings.HasPrefix .URL "http" }}target="_blank" rel="noopener"{{ end }}>
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      </ul>
      <a href="/spielbetrieb/" class="btn-nav-cta">
        🏀 Spielplan
      </a>
    </nav>
  </div>
</header>
