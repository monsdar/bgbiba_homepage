<!-- Topbar -->
<div class="topbar">
  <div class="container topbar-inner">
    <div class="topbar-links">
      <a href="{{ site.Params.instagram }}" target="_blank" rel="noopener noreferrer" class="topbar-link" title="Instagram">
        <span>📸 Instagram</span>
      </a>
      <a href="{{ site.Params.whatsapp }}" target="_blank" rel="noopener noreferrer" class="topbar-link" title="WhatsApp Channel">
        <span>💬 WhatsApp</span>
      </a>
    </div>
  </div>
</div>

<!-- Main Header -->
<header class="header">
  <div class="container">
    <a href="{{ "" | relURL }}" class="brand">
      <img src="{{ strings.TrimPrefix "/" site.Params.logo | relURL }}" alt="{{ site.Title }} Logo" class="brand-logo" width="48" height="48">
      <div class="brand-text">
        <span class="brand-title">{{ site.Params.short_name }}</span>
        <span class="brand-subtitle">Basketball</span>
      </div>
    </a>

    <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Menü öffnen">
      ☰
    </button>

    <nav class="nav" id="main-nav">
      <ul class="nav-list">
        {{ range site.Menus.main }}
          <li>
            <a href="{{ strings.TrimPrefix "/" .URL | relURL }}" class="nav-link {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (and (eq .URL "/teams/") (eq $.Section "teams")) (and (eq .URL "/mitglied-werden/") (strings.HasPrefix $.RelPermalink ("mitglied-werden" | relURL))) }}active{{ end }}" {{ if strings.HasPrefix .URL "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      </ul>
      <a href="{{ "kontakt/" | relURL }}" class="btn-nav-cta">
        ✉️ Kontakt
      </a>
    </nav>
  </div>
</header>
